<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setu | Offline-First Telemedicine Platform</title>
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#F7F9F8;
  --paper-dim:#EEF2F1;
  --ink:#0B2436;
  --ink-soft:#43586A;
  --bridge:#0E7C7B;
  --bridge-dark:#0A5F5E;
  --signal:#1FA7B8;
  --amber:#C98A2C;
  --amber-bg:#FBF1DF;
  --coral:#C4574F;
  --coral-bg:#FBEAE8;
  --green:#2E8B57;
  --green-bg:#E7F3EC;
  --mist:#E7EEF0;
  --card:#FFFFFF;
  --line:#DCE4E4;
  --radius:10px;
  --shadow:0 1px 2px rgba(11,36,54,.04), 0 4px 14px rgba(11,36,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;color:var(--ink)}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:var(--signal);color:#fff}

/* ---------- Layout shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:19px}
.brand .mark{width:26px;height:26px;position:relative}
.topbar-right{display:flex;align-items:center;gap:14px}

.net-pill{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  font-size:12.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;
  border:1px solid var(--line);
}
.net-pill .dot{width:7px;height:7px;border-radius:50%}
.net-online{background:var(--green-bg);color:#1F6B44;border-color:#c7e5d2}
.net-online .dot{background:var(--green);box-shadow:0 0 0 3px rgba(46,139,87,.18)}
.net-offline{background:var(--amber-bg);color:#8a5c14;border-color:#efdcb4}
.net-offline .dot{background:var(--amber)}
.net-syncing{background:#E4F3F5;color:var(--bridge-dark);border-color:#bfe3e6}
.net-syncing .dot{background:var(--signal);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.offline-banner{
  background:var(--amber-bg);color:#7a5210;border-bottom:1px solid #efdcb4;
  padding:9px 24px;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.offline-banner b{font-weight:600}

.shell{display:flex;flex:1;min-height:0}
.sidebar{
  width:222px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
  padding:18px 12px;display:flex;flex-direction:column;gap:2px;
}
.sidebar .grp-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:14px 10px 6px}
.side-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:500;
  color:var(--ink-soft);
}
.side-link:hover{background:var(--paper-dim);color:var(--ink)}
.side-link.active{background:var(--bridge);color:#fff}
.side-link .ico{width:16px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px}

.main{flex:1;min-width:0;overflow-y:auto;padding:26px 32px 60px}
.main-inner{max-width:1180px;margin:0 auto}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:26px}
.page-head p{color:var(--ink-soft);font-size:14px;margin-top:3px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bridge);margin-bottom:6px;display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--bridge);color:#fff}
.btn-primary:hover{background:var(--bridge-dark)}
.btn-ghost{background:var(--paper-dim);color:var(--ink)}
.btn-ghost:hover{background:var(--mist)}
.btn-outline{border:1px solid var(--line);color:var(--ink)}
.btn-outline:hover{border-color:var(--bridge);color:var(--bridge)}
.btn-danger{background:var(--coral-bg);color:var(--coral)}
.btn-sm{padding:6px 11px;font-size:12.5px}

.g-4{grid-template-columns:repeat(4,1fr)}

.section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:between;gap:8px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.b-pending{background:var(--amber-bg);color:#8a5c14}
.b-synced{background:var(--green-bg);color:#1F6B44}
.b-syncing{background:#E4F3F5;color:var(--bridge-dark)}
.b-failed,.b-conflict{background:var(--coral-bg);color:var(--coral)}
.b-confirmed{background:var(--green-bg);color:#1F6B44}
.b-completed{background:#E4F3F5;color:var(--bridge-dark)}
.b-cancelled{background:var(--coral-bg);color:var(--coral)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--paper-dim)}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{

}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--signal);outline-offset:1px;border-color:var(--signal)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:

.role-tabs{display:flex;gap:6px;background:var(--paper-dim);padding:4px;border-radius:9px;margin-bottom:18px}

.role-tab.active{background:#fff;color:var(--bridge);box-shadow:0 1px 3px rgba(11,36,54,.12)}
.demo-creds{background:var(--paper-dim);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-top:14px;font-family:'IBM Plex Mono',monospace}

/* landing */
.landing-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--line)}
.hero{padding:70px 40px 40px;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:40px}}
.hero h1{font-size:44px;line-height:1.08;margin-bottom:16px}
.hero p{font-size:16.5px;color:var(--ink-soft);max-width:520px;margin-bottom:26px}
.hero .cta-row{display:flex;gap:12px;flex-wrap:wrap}

/* bridge signature graphic */
.bridge-graphic{position:relative;height:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bridge-graphic svg{width:100%;height:100%}
.node-label{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--ink-soft)}

.feature-strip{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:50px 40px}
.feature-strip .grid{max-width:1180px;margin:0 auto}
.feat{padding:4px}
.feat .n{font-family:'IBM Plex Mono',monospace;color:var(--bridge);font-size:12px;margin-bottom:8px}
.feat h3{font-size:16.5px;margin-bottom:6px}

.disclaimer-strip{background:var(--ink);color:#CBD8DF;padding:14px 40px;font-size:12.5px;text-align:center}
.disclaimer-strip b{color:#fff}

/* empty / loading states */
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.empty-state .glyph{font-size:26px;margin-bottom:8px;font-family:'IBM Plex Mono',monospace}
.spin{width:16px;height:16px;border:2px solid var(--mist);border-top-color:var(--bridge);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* toasts */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--ink);color:#fff;padding:12px 15px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:9px;align-items:flex-start;animation:slidein .2s ease}
.toast.success{background:#1F6B44}
.toast.error{background:var(--coral)}
.toast.warn{background:var(--amber)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,36,54,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.close-x{font-size:18px;color:var(--ink-soft);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.close-x:hover{background:var(--paper-dim)}

/* consultation video mockup */
.video-stage{background:linear-gradient(160deg,#0B2436,#153B4D);border-radius:14px;padding:20px;color:#fff;position:relative}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.video-tile{background:#0e2e3d;border-radius:10px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);position:relative}
.video-tile .avatar{width:56px;height:56px;border-radius:50%;background:var(--bridge);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;margin-bottom:8px}
.video-tile .tag{position:absolute;bottom:8px;left:10px;font-size:11.5px;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:5px}
.video-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.vctrl{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.vctrl:hover{background:rgba(255,255,255,.22)}
.vctrl.end{background:var(--coral);width:auto;padding:0 18px;border-radius:21px;font-weight:600;font-size:13px;gap:6px}
.proto-note{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.25);border-radius:8px;padding:10px 12px;font-size:12px;margin-top:14px;color:#CBD8DF}

/* progress bar */
.pbar{height:7px;background:var(--paper-dim);border-radius:99px;overflow:hidden}
.pbar > div{height:100%;background:var(--bridge);border-radius:99px;transition:width .4s ease}

/* sync log */
.sync-log{max-height:190px;overflow-y:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--paper-dim);border-radius:8px;padding:10px 12px}
.sync-log .ln{padding:3px 0;color:var(--ink-soft)}
.sync-log .ln b{color:var(--ink)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent}
.tab.active{color:var(--bridge);border-color:var(--bridge)}

.mob-nav{display:none}
@media(max-width:780px){
  .sidebar{display:none}
  .mob-nav{display:flex;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:8px 0;z-index:40}
  .mob-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-soft)}
  .mob-nav a.active{color:var(--bridge)}
  .main{padding:18px 16px 20px}
  .row2,.row3{grid-template-columns:1fr}
  .hero{padding-left:20px;padding-right:20px}
}
footer.site-footer{padding:22px 40px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);text-align:center}
</style>

<body>
<div id="app"></div>
<div id="toast-wrap"></div>

<script>
/* =========================================================================
   SETU — Offline-First Telemedicine Platform
   Self-contained single-file prototype.

   ARCHITECTURE NOTE (read me):
   A real MERN deployment (React/Vite client + Node/Express API + MongoDB)
   cannot run as one static file — a server process and a database are
   separate long-running services. This file instead simulates that split
   entirely in the browser, so it can be opened directly with no install:

     - "IndexedDB"  -> the on-device local store (window.indexedDB)
     - "Cloud/DB"   -> a simulated central MongoDB, kept in a separate
                       localStorage namespace, only reachable when
                       navigator.onLine / the demo toggle says ONLINE.
     - Sync Engine  -> pushes the local Sync Queue to the "cloud" store
                       and pulls fresh data back, exactly following the
                       CREATE/UPDATE/DELETE + PENDING/SYNCING/SYNCED/
                       FAILED/CONFLICT model from the spec.

   This preserves the full offline-first flow — offline capture, sync
   queue, automatic sync, conflict handling — for demonstration, while
   being honest that production infra would separate these tiers.
   ========================================================================= */

const DB_NAME = 'setu_local_db';
const DB_VERSION = 1;
const STORES = ['users','patients','doctors','appointments','medicalRecords','consultations','prescriptions','notifications','syncQueue','meta'];
let idb = null;

function openLocalDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      STORES.forEach(name=>{
        if(!db.objectStoreNames.contains(name)) db.createObjectStore(name,{keyPath:'id'});
      });
    };
    req.onsuccess = ()=>{ idb = req.result; resolve(idb); };
    req.onerror = ()=> reject(req.error);
  });
}
function idbAll(store){
  return new Promise((res,rej)=>{
    const tx = idb.transaction(store,'readonly').objectStore(store).getAll();
    tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error);
  });
}
function idbPut(store,val){
  return new Promise((res,rej)=>{
    const tx = idb.transaction(store,'readwrite').objectStore(store).put(val);
    tx.onsuccess=()=>res(val); tx.onerror=()=>rej(tx.error);
  });
}
function idbDel(store,id){
  return new Promise((res,rej)=>{
    const tx = idb.transaction(store,'readwrite').objectStore(store).delete(id);
    tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
function idbClearAll(){
  return new Promise((res)=>{
    const tx = idb.transaction(STORES,'readwrite');
    STORES.forEach(s=>tx.objectStore(s).clear());
    tx.oncomplete=()=>res();
  });
}

/* ---------------- Simulated Cloud (MongoDB stand-in) -------------------- */
const CLOUD_KEY = 'setu_cloud_db_v1';
function cloudRead(){
  const raw = localStorage.getItem(CLOUD_KEY);
  return raw ? JSON.parse(raw) : null;
}
function cloudWrite(db){ localStorage.setItem(CLOUD_KEY, JSON.stringify(db)); }
function cloudCollection(name){
  const db = cloudRead(); return db[name] || [];
}
function cloudUpsert(name, record){
  const db = cloudRead(); db[name] = db[name]||[];
  const i = db[name].findIndex(r=>r.id===record.id);
  if(i>-1) db[name][i]=record; else db[name].push(record);
  cloudWrite(db); return record;
}
function cloudDelete(name,id){
  const db = cloudRead(); db[name]=(db[name]||[]).filter(r=>r.id!==id); cloudWrite(db);
}

/* ---------------- Utilities ---------------- */
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(iso){ return fmtDate(iso)+', '+fmtTime(iso); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

let toastSeq=0;
function toast(msg,type='info',ms=3800){
  const id='t'+(toastSeq++);
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='toast '+(type==='info'?'':type);
  el.id=id;
  const icon = type==='success'?'&#10003;': type==='error'?'&#33;': type==='warn'?'&#9888;':'&#8505;';
  el.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, ms);
}

/* ---------------- App State ---------------- */
const AppState = {
  isOnline: navigator.onLine,
  demoOfflineForced: false,   // manual "Simulate Offline Mode" toggle
  currentUser: null,          // {id, role, name, ...}
  route: '#/',
  syncing: false,
  syncLog: [],
  data: { users:[],patients:[],doctors:[],appointments:[],medicalRecords:[],consultations:[],prescriptions:[],notifications:[],syncQueue:[] }
};
function effectiveOnline(){ return AppState.isOnline && !AppState.demoOfflineForced; }

async function refreshLocalCache(){
  for(const s of ['users','patients','doctors','appointments','medicalRecords','consultations','prescriptions','notifications','syncQueue']){
    AppState.data[s] = await idbAll(s);
  }
}

/* ---------------- Seed Data ---------------- */
const SPECIALIZATIONS = ['General Physician','Pediatrics','Gynecology','Cardiology','Dermatology'];
const DOCTOR_NAMES = ['Dr. Ashok Deshmukh','Dr. Meera Kulkarni','Dr. Sanjay Rao','Dr. Priya Nair','Dr. Vikram Joshi'];
const PATIENT_NAMES = ['Ramesh Patil','Sita Devi','Mahesh Yadav','Anjali Verma','Rohit Sharma','Kavita Pawar','Suresh Gaikwad','Lata Kadam','Imran Sheikh','Pooja More'];
const VILLAGES = ['Wadgaon','Shirur','Baramati','Karad','Sangamner','Junnar','Indapur','Phaltan','Daund','Mulshi'];

function buildSeed(){
  const users=[], patients=[], doctors=[], appointments=[], medicalRecords=[], consultations=[], prescriptions=[], notifications=[];

  const adminUser = {id:uid('usr'), role:'admin', name:'Admin Office', email:'admin@setu.health', password:'admin123', createdAt:nowISO()};
  users.push(adminUser);

  DOCTOR_NAMES.forEach((name,i)=>{
    const userId = uid('usr');
    users.push({id:userId, role:'doctor', name, email:`doctor${i+1}@setu.health`, password:'doctor123', createdAt:nowISO()});
    doctors.push({
      id:uid('doc'), userId, name, specialization: SPECIALIZATIONS[i%SPECIALIZATIONS.length],
      qualification:'MBBS, MD', experience: 5+i*3, availability:'09:00-17:00', village:VILLAGES[i],
      version:1, syncStatus:'SYNCED', updatedAt:nowISO(), lastSyncedAt:nowISO()
    });
  });

  PATIENT_NAMES.forEach((name,i)=>{

async function ensureSeeded(){
  let cloud = cloudRead();
  if(!cloud){
    const seed = buildSeed();
    cloud = {...seed, syncQueue:[]};
    cloudWrite(cloud);
  }
  // first-run local cache: pull everything down once (simulates initial online sync)
  const meta = await idbAll('meta');
  if(!meta.find(m=>m.id==='seeded')){
    for(const store of ['users','patients','doctors','appointments','medicalRecords','consultations','prescriptions','notifications']){
      for(const rec of cloud[store]) await idbPut(store, rec);
    }
    await idbPut('meta',{id:'seeded', at:nowISO()});
    await idbPut('meta',{id:'lastSync', at:nowISO()});
  }
  await refreshLocalCache();
}
/* ---------------- Offline-first write path ---------------- */
// Every mutation: write to IndexedDB immediately, enqueue a SyncQueue item.
// If online right now, the sync engine is kicked off right after.
async function writeLocal(store, record, operation){
  const isNew = !record.version;
  record.updatedAt = nowISO();
  record.deviceId = record.deviceId || getDeviceId();
  record.version = (record.version||0) + (operation==='UPDATE'?1:0) || 1;
  record.syncStatus = 'PENDING';
  await idbPut(store, record);

  const qItem = {
    id: uid('sq'), entityType: store, entityId: record.id, operation,
    payload: record, timestamp: nowISO(), retryCount: 0, status: 'PENDING', errorMessage: null
  };
  await idbPut('syncQueue', qItem);
  await refreshLocalCache();

  if(effectiveOnline()){ processSyncQueue(); } else { logSync(`Queued ${operation} on ${store} (${record.id}) — offline, will sync later.`); }
  return record;
}
async function deleteLocal(store, id){
  await idbDel(store, id);
  const qItem = {id:uid('sq'), entityType:store, entityId:id, operation:'DELETE', payload:{id}, timestamp:nowISO(), retryCount:0, status:'PENDING', errorMessage:null};
  await idbPut('syncQueue', qItem);
  await refreshLocalCache();
  if(effectiveOnline()) processSyncQueue(); else logSync(`Queued DELETE on ${store} (${id}) — offline.`);
}
function getDeviceId(){
  let d = localStorage.getItem('setu_device_id');
  if(!d){ d = uid('dev'); localStorage.setItem('setu_device_id', d); }
  return d;
}
function logSync(line){
  AppState.syncLog.unshift(`[${fmtTime(nowISO())}] ${line}`);
  AppState.syncLog = AppState.syncLog.slice(0,40);
}

/* ---------------- Sync Engine ---------------- */
async function processSyncQueue(){
  if(!effectiveOnline() || AppState.syncing) return;
  const queue = (await idbAll('syncQueue')).filter(q=>q.status==='PENDING' || q.status==='FAILED');
  if(queue.length===0) return;

  AppState.syncing = true;
  render();
  logSync(`Sync started — ${queue.length} pending change(s).`);

  for(const item of queue){
    item.status='SYNCING'; await idbPut('syncQueue', item);
    render();
    await wait(450 + Math.random()*350); // simulate network latency

    try{
      if(item.operation==='DELETE'){
        cloudDelete(item.entityType, item.entityId);
        await idbDel(item.entityType, item.entityId);
        item.status='SYNCED';
        logSync(`DELETE ${item.entityType} ${item.entityId} → synced.`);
      } else {
        const cloudColl = cloudCollection(item.entityType);
        const serverRec = cloudColl.find(r=>r.id===item.entityId);
        // conflict check: server was updated after this local edit was based on
        if(serverRec && item.payload.baseUpdatedAt && serverRec.updatedAt > item.payload.baseUpdatedAt && serverRec.version !== item.payload.version-1){
          item.status='CONFLICT';
          item.errorMessage = 'Server record changed since your last sync.';
          const localRec = await idbAllFind(item.entityType, item.entityId);
          if(localRec){ localRec.syncStatus='CONFLICT'; await idbPut(item.entityType, localRec); }
          logSync(`CONFLICT on ${item.entityType} ${item.entityId} — needs manual review.`);
        } else {
          const synced = {...item.payload, syncStatus:'SYNCED', lastSyncedAt:nowISO()};
          cloudUpsert(item.entityType, synced);
          await idbPut(item.entityType, synced);
          item.status='SYNCED';
          logSync(`${item.operation} ${item.entityType} ${item.entityId} → synced.`);
        }
      }
    }catch(err){
      item.retryCount+=1; item.status='FAILED'; item.errorMessage=String(err.message||err);
      logSync(`FAILED ${item.entityType} ${item.entityId}: ${item.errorMessage}`);
    }
    await idbPut('syncQueue', item);
  }

  await idbPut('meta',{id:'lastSync', at:nowISO()});
  await refreshLocalCache();
  AppState.syncing = false;
  const synced = queue.filter(q=>q.status==='SYNCED').length;
  const conflicts = queue.filter(q=>q.status==='CONFLICT').length;
  const failed = queue.filter(q=>q.status==='FAILED').length;
  if(conflicts>0) toast(`Sync finished with ${conflicts} conflict(s) to review.`,'warn');
  else if(failed>0) toast(`Sync finished — ${failed} item(s) failed, will retry.`,'error');
  else if(synced>0) toast(`Synchronized ${synced} change(s) successfully.`,'success');
  render();
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function idbAllFind(store,id){ const all = await idbAll(store); return all.find(r=>r.id===id); }

async function retryFailed(){
  const q = await idbAll('syncQueue');
  for(const item of q){ if(item.status==='FAILED'){ item.status='PENDING'; item.errorMessage=null; await idbPut('syncQueue', item); } }
  await refreshLocalCache(); render();
  processSyncQueue();
}
async function resolveConflict(queueId, keepServer){
  const q = await idbAll('syncQueue');
  const item = q.find(i=>i.id===queueId);
  if(!item) return;
  if(keepServer){
    const serverRec = cloudCollection(item.entityType).find(r=>r.id===item.entityId);
    if(serverRec) await idbPut(item.entityType, {...serverRec, syncStatus:'SYNCED'});
    logSync(`Conflict resolved on ${item.entityType} ${item.entityId} — kept SERVER version.`);
  } else {
    const merged = {...item.payload, version:(item.payload.version||1)+1, syncStatus:'SYNCED', lastSyncedAt:nowISO()};
    cloudUpsert(item.entityType, merged);
    await idbPut(item.entityType, merged);
    logSync(`Conflict resolved on ${item.entityType} ${item.entityId} — kept LOCAL version.`);
  }
  item.status='SYNCED'; await idbPut('syncQueue', item);
  await refreshLocalCache();
  toast('Conflict resolved.','success');
  render();
}

function attachAuthHandlers(){
  document.querySelectorAll('.role-tab').forEach(t=>t.addEventListener('click',()=>{ window.__loginRole=t.dataset.role; render(); }));
  const lf=document.getElementById('login-form');
  if(lf) lf.addEventListener('submit',(e)=>{ e.preventDefault(); const f=new FormData(lf); login(f.get('email'),f.get('password'), window.__loginRole||'patient'); });
  const rf=document.getElementById('register-form');
  if(rf) rf.addEventListener('submit',(e)=>{ e.preventDefault(); const f=new FormData(rf); registerPatient(Object.fromEntries(f.entries())); });
}

/* ---------------- Synchronization dashboard ---------------- */
function syncDashboard(){
  const q = AppState.data.syncQueue.slice().sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
  const synced = q.filter(i=>i.status==='SYNCED').length;
  const failed = q.filter(i=>i.status==='FAILED').length;
  const conflicts = q.filter(i=>i.status==='CONFLICT').length;
  const pending = q.filter(i=>i.status==='PENDING'||i.status==='SYNCING').length;
  const total = q.length||1;
  const pct = Math.round((synced/total)*100);

  const collections = ['patients','appointments','consultations','prescriptions','medicalRecords'];
  const collStatus = collections.map(c=>{
    const items = AppState.data.syncQueue.filter(i=>i.entityType===c);
    const hasPending = items.some(i=>i.status==='PENDING'||i.status==='SYNCING');
    const hasConflict = items.some(i=>i.status==='CONFLICT');
    const label = c==='medicalRecords'?'Medical Records': c[0].toUpperCase()+c.slice(1);
    const state = hasConflict? ['⚠ Conflict','b-conflict'] : hasPending? ['↑ Syncing','b-syncing'] : ['✓ Synced','b-synced'];
    return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:13.5px">${label}</span><span class="badge ${state[1]}">${state[0]}</span></div>`;
  }).join('');

  return `
  ${pageHead('Sync','Synchronization dashboard','Monitor offline changes and resolve conflicts.',
    `<button class="btn btn-outline" data-action="retry-failed" ${failed===0?'disabled':''}>Retry failed</button>
     <button class="btn btn-primary" data-action="manual-sync" ${effectiveOnline()?'':'disabled'}>${AppState.syncing?'Syncing…':'Sync now'}</button>`)}

  <div class="grid g-4" style="margin-bottom:18px">
    ${statCard('Pending changes',pending,'var(--amber-bg)','var(--amber)','⇅')}
    ${statCard('Successful syncs',synced,'var(--green-bg)','#1F6B44','✓')}
    ${statCard('Failed syncs',failed,'var(--coral-bg)','var(--coral)','✕')}
    ${statCard('Conflicts',conflicts,conflicts>0?'var(--coral-bg)':'var(--paper-dim)',conflicts>0?'var(--coral)':'var(--ink)','⚠')}
  </div>

  <div class="grid g-2" style="margin-bottom:18px">
    <div class="card card-pad">
      <div class="section-title">Collection status</div>
      ${collStatus}
      <div style="margin-top:14px"><div class="pbar"><div style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">${pct}% of tracked changes synced</div></div>
    </div>
    <div class="card card-pad">
      <div class="section-title">Sync activity log</div>
      <div class="sync-log">${AppState.syncLog.length? AppState.syncLog.map(l=>`<div class="ln">${esc(l)}</div>`).join('') : '<div class="ln">No activity yet this session.</div>'}</div>
    </div>
  </div>

  ${conflicts>0 ? `<div class="card card-pad" style="margin-bottom:18px;border-color:#f0c9c5">
    <div class="section-title" style="color:var(--coral)">Conflicts needing review</div>
    ${q.filter(i=>i.status==='CONFLICT').map(conflictRow).join('')}
  </div>`:''}

  <div class="card">
    <div style="padding:14px 20px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)">Sync queue</div>
    <table>
      <thead><tr><th>ID</th><th>Entity</th><th>Operation</th><th>Time</th><th>Status</th><th>Retry</th></tr></thead>
      <tbody>
      ${q.length? q.slice(0,25).map(i=>`
        <tr><td class="mono">${i.id.slice(0,10)}</td><td>${i.entityType}</td><td>${i.operation}</td>
        <td>${fmtDateTime(i.timestamp)}</td><td>${badgeFor(i.status)}</td><td>${i.retryCount}</td></tr>`).join('')
        : `<tr><td colspan="6">${emptyStateInline('Sync queue is empty','Every offline change you make will appear here.')}</td></tr>`}
      </tbody>
    </table>
  </div>`;
}
function conflictRow(item){
  const serverRec = cloudCollection(item.entityType).find(r=>r.id===item.entityId) || {};
  return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
    <div style="font-size:13.5px;font-weight:600;margin-bottom:6px">${item.entityType} · ${item.entityId}</div>
    <div class="row2" style="margin-bottom:10px">
      <div class="mono" style="font-size:11.5px;background:var(--paper-dim);padding:8px;border-radius:6px">SERVER<br>updated ${fmtDateTime(serverRec.updatedAt||item.timestamp)}</div>
      <div class="mono" style="font-size:11.5px;background:var(--paper-dim);padding:8px;border-radius:6px">LOCAL<br>updated ${fmtDateTime(item.payload.updatedAt||item.timestamp)}</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm btn-outline" data-action="resolve-conflict" data-id="${item.id}" data-keep="server">Keep server version</button>
      <button class="btn btn-sm btn-primary" data-action="resolve-conflict" data-id="${item.id}" data-keep="local">Keep local version</button>
    </div>
  </div>`;
}

function barChart(pairs){
  const max = Math.max(1,...pairs.map(p=>p[1]));
  return `<div style="display:flex;flex-direction:column;gap:10px">${pairs.map(([label,val])=>`
    <div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${label}</span><b>${val}</b></div>
      <div class="pbar"><div style="width:${(val/max*100)||2}%"></div></div>
    </div>`).join('')}</div>`;
}
function lineSpark(){
  const pts = Array.from({length:7},()=>Math.floor(Math.random()*6)+1);
  const max=Math.max(...pts);
  const w=280,h=90,step=w/(pts.length-1);
  const path = pts.map((v,i)=>`${i*step},${h-(v/max*h)+8}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h+16}" style="width:100%;height:110px">
    <polyline points="${path}" fill="none" stroke="#0E7C7B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((v,i)=>`<circle cx="${i*step}" cy="${h-(v/max*h)+8}" r="3" fill="#1FA7B8"/>`).join('')}
  </svg>`;
}

let __wired = false;
function globalClickHandler(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;

  if(action==='logout') return logout();
  if(action==='toggle-demo-offline') return toggleDemoOffline();
  if(action==='manual-sync'){
    if(!effectiveOnline()){ toast('You are offline — turn off simulated offline mode or wait for a connection.','warn'); return; }
    return processSyncQueue();
  }
  if(action==='close-modal') return closeModal();
  if(action==='open-book-appt') return openBookAppt();
  if(action==='open-new-rx') return openNewRx();
  if(action==='view-patient') return viewPatientHistory(id);
  if(action==='end-call'){ toast('Call ended.','info'); return; }
  if(action==='print-rx' || action==='download-rx'){ toast(action==='print-rx'?'Preparing print view…':'Preparing download…','info'); return; }
  if(action==='download-record'){ toast('Preparing download…','info'); return; }

  if(action==='submit-book-appt'){
    const form = document.getElementById('book-form');
    if(!form.reportValidity()) return;
    const f = new FormData(form);
    const pat = currentPatientRecord();
    const doc = AppState.data.doctors.find(d=>d.id===f.get('doctorId'));
    const record = {id:uid('apt'), patientId:pat.id, doctorId:doc.id, patientName:pat.name, doctorName:doc.name,
      date:f.get('date'), time:f.get('time'), reason:f.get('reason'), status:'PENDING', createdAt:nowISO(), baseUpdatedAt:nowISO()};
    writeLocal('appointments', record, 'CREATE').then(()=>{
      closeModal();
      toast(effectiveOnline()?'Appointment booked.':'Appointment saved offline — will sync when online.','success');
      render();
    });
    return;
  }
  if(action==='cancel-appt' || action==='accept-appt' || action==='reject-appt' || action==='complete-appt'){
    const appt = AppState.data.appointments.find(a=>a.id===id);
    if(!appt) return;
    appt.baseUpdatedAt = appt.updatedAt;
    appt.status = action==='cancel-appt'?'CANCELLED': action==='accept-appt'?'CONFIRMED': action==='reject-appt'?'CANCELLED':'COMPLETED';
    writeLocal('appointments', appt, 'UPDATE').then(()=>{ toast('Appointment updated.','success'); render(); });
    return;
  }
  if(action==='submit-new-rx'){
    const form = document.getElementById('rx-form');
    if(!form.reportValidity()) return;
    const f = new FormData(form);
    const names=f.getAll('med_name'), doses=f.getAll('med_dose'), freqs=f.getAll('med_freq'), durs=f.getAll('med_dur');
    const medicines = names.map((n,i)=>({n, d:doses[i]||'—', f:freqs[i]||'—', du:durs[i]||'—', i:'As directed'})).filter(m=>m.n.trim());
    if(medicines.length===0){ toast('Add at least one medicine.','error'); return; }
    const doc = currentDoctorRecord();
    const pat = AppState.data.patients.find(p=>p.id===f.get('patientId'));
    const record = {id:uid('rx'), patientId:pat.id, doctorId:doc.id, patientName:pat.name, doctorName:doc.name,
      date:nowISO(), medicines, notes:f.get('notes')||'Educational prototype prescription.', createdAt:nowISO(), baseUpdatedAt:nowISO()};
    writeLocal('prescriptions', record, 'CREATE').then(()=>{
      closeModal();
      toast(effectiveOnline()?'Prescription saved.':'Prescription saved offline — pending synchronization.','success');
      render();
    });
    return;
  }
  if(action==='retry-failed') return retryFailed();
  if(action==='resolve-conflict') return resolveConflict(id, t.dataset.keep==='server');
}

function onSubmitConsult(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const doc = currentDoctorRecord();
  const pat = AppState.data.patients.find(p=>p.id===f.get('patientId'));
  const record = {
    id:uid('con'), patientId:pat.id, doctorId:doc.id, patientName:pat.name, doctorName:doc.name,
    symptoms:f.get('symptoms'), observations:f.get('observations')||'—',
    diagnosisNotes:f.get('diagnosisNotes')||'Educational note only — not a definitive diagnosis.',
    treatmentNotes:f.get('treatmentNotes')||'—', followUpDate:f.get('followUpDate')||null,
    date:nowISO(), createdAt:nowISO(), baseUpdatedAt:nowISO()
  };
  writeLocal('consultations', record, 'CREATE').then(()=>{
    toast(effectiveOnline()? 'Consultation synchronized successfully.' : 'Saved offline — pending synchronization.', 'success');
    e.target.reset();
    render();
  });
}

/* ---------------- Init ---------------- */
async function updateLastSyncLabel(){
  const meta = await idbAll('meta');
  const m = meta.find(x=>x.id==='lastSync');
  window.__lastSyncLabel = m ? fmtDateTime(m.at) : 'never';
}
const _origProcessSyncQueue = processSyncQueue;
processSyncQueue = async function(){ await _origProcessSyncQueue(); await updateLastSyncLabel(); render(); };

async function init(){
  await openLocalDB();
  await ensureSeeded();
  await updateLastSyncLabel();

  document.body.addEventListener('click', globalClickHandler);

  const saved = sessionStorage.getItem('setu_session');
  if(saved){ try{ AppState.currentUser = JSON.parse(saved); }catch(e){} }

  if(!location.hash) location.hash = AppState.currentUser ? '#/'+AppState.currentUser.role+'/dashboard' : '#/';
  router();

  if(effectiveOnline()) processSyncQueue();
}
init();
